# Hexagon project configuration. Values shown are the defaults.

[run]
max_parallel = 4        # agents running at once
max_attempts = 2        # attempts per task (a retry escalates effort one level)
fix_loops = 2           # how many times an agent may hand work back to another task
max_fix_cycles = 3      # verify/review repair cycles per task; 0 = unlimited (stops early on identical repeated failures)
release_on_conflict = true   # a merge conflict goes to the release engineer once (conflicted files only, verified), then blocks
checkpoint_after_first = true  # a graph pauses new starts once the first task is merged: "are we still building the right thing?" (/resume continues)
require_spike = true      # analysis that shows an unknown cause, a cross-cutting change or unclear boundaries must plan read-only spikes before the spec
shared_files = []         # paths no task may be granted through `hexagon scope request` (e.g. a generated registry); the integration owns them
test_command = ""         # runs one test to prove it fails without the change, e.g. "npx vitest run {file} -t {name}" or "go test ./... -run {name}"; empty = re-run the task's verify commands
integration_verify = "merged"  # after each merge, re-run this task's verify + those of tasks already merged ("task" = only this task's, "full" = also final_verify)
final_verify = []        # must pass on the integration branch before /merge (empty = every task's verify commands); `hexagon init` fills it from HEXAGON.md
task_budget_tokens = 3000000   # one task stops and asks after this many tokens (input + cache reads + output); 0 = no cap
max_identical_failures = 3  # same failure this many times in a row = no progress, escalate to you
budget_tokens = 0       # pause the run after this many tokens (input + cached + output; 0 = no limit)
# base_branch = "main"  # default: the branch checked out when the run starts

# Which agent and effort each role uses. Agents are defined below. Hexagon ships NO model names: each CLI
# keeps using its own configured default. To override for a role add `model = "<identifier>"` (an opaque string
# handed to that CLI as-is; `hexagon agents models <agent>` lists what the CLI reports, when it can).
# Optional `fallback_agent = "<agent>"` is used only when [recovery].allow_provider_failover = true.
# Change from the dashboard with /model <role> <model|default>, or `hexagon agents configure`.
# Project Onboarding: studies a repo, writes HEXAGON.md
[roles.bootstrap]
agent = "claude"
effort = "low"
# Business & Systems Analyst: analysis, spec, task graph
[roles.analyst]
agent = "claude"
effort = "high"
# Software Development Engineer
[roles.developer]
agent = "claude"
effort = "medium"
# QA Engineer (SDET)
[roles.qa]
agent = "claude"
effort = "medium"
# Code Reviewer (read-only)
[roles.reviewer]
agent = "claude"
effort = "high"
# Hexagon Assistant: the main chat that operates Hexagon
[roles.control]
agent = "claude"
effort = "low"
# Also built in, same keys: architect, devops, security, release. Old names (planner, implementer, tester,
# integrator, resolver, lead, init) still load and are renamed in this file on first start.
#
# Your own role: give it a prompt (a file in .hexagon/roles/ or in the project) and, optionally, skills.
# [roles.docs]
# agent = "claude"
# prompt = "docs.md"
# title = "Technical Writer"
# skills = ["commit-conventions"]
# group = "implementation"        # analysis | implementation | review | integration

# Agents are coding CLIs that Hexagon wraps; each runs in its own git worktree.
# claude-code: the Claude Code CLI (streams events, takes live messages, takeover = `claude --resume`).
[agents.claude]
adapter = "claude-code"
provider = "anthropic"
command = ["claude"]
# model = "..."         # optional override; omit to use Claude Code's own default
# args = ["--add-dir", "../shared"]

# OpenAI Codex CLI and xAI Grok CLI (integrations are unverified against the real CLIs; see docs/PROVIDERS.md):
# [agents.codex]
# adapter = "codex"
# provider = "openai"
# command = ["codex"]
# [agents.grok]
# adapter = "grok"
# provider = "xai"
# command = ["grok"]

# Any other non-interactive coding CLI (the prompt arrives on stdin; name "{prompt}" or "{prompt_file}" in the command to pass it as an argument / temp file):
# [agents.other]
# adapter = "exec"
# provider = "acme"
# command = ["acme-agent", "run", "{prompt}"]

# Third-party adapters (a manifest .toml/.json or a module); see docs/ADAPTERS.md:
# [plugins]
# adapters = ["./adapters/example.toml"]

# Scripted offline agent, useful to try the workflow without spending anything:
#   set agent = "mock" for every role, or `hexagon run plan.json --agent mock`
[agents.mock]
adapter = "mock"
step_ms = 600

# Provider limits (rate limit, usage quota, context overflow, truncation) never count as repair cycles or attempts.
[recovery]
enabled = true
auto_resume = true              # wait for the reset and continue the same task and session by itself
unlimited_quota_wait = true
allow_provider_failover = false # true: a role's `fallback_agent` may take over when its provider is exhausted
initial_backoff_seconds = 60    # used only when the provider reports no reset time (labelled "estimated")
max_backoff_seconds = 3600
backoff_multiplier = 2
backoff_jitter = true
max_wait_seconds = 0            # 0 = wait as long as it takes
max_context_recoveries = 3      # fresh compacted sessions after context overflow

# One session per agent identity is reused for the whole project. It is compacted between turns
# (never mid tool call) when it fills up; the task card, acceptance criteria, review feedback and changed
# files are rebuilt from disk into the fresh session. /compact [agent] forces it.
[context]
mode = "auto"                   # "auto" | "manual" | "off"
compact_at = 0.70               # fraction of the model's context window
min_turns_between = 3
assumed_window_tokens = 200000  # used when the CLI reports no window
session_scope = "project"       # "project": one session per agent for the whole project · "task": a fresh session per task
task_boundary = "note"          # project scope, new task in a reused session: "note" | "compact"

[bench]
max_cost_usd = 5               # `hexagon bench` and `hexagon eval` run real agents; they stop when the cost the CLI reports reaches this

# The control agent (chat) changes the graph, agents and runs only through typed commands. Each change is shown
# as a diff and waits for your confirmation; destructive ones (remove, cancel) always do.
[control]
auto_apply = false              # true: apply non-destructive proposals without asking

[review]
mode = "agent"          # "agent" | "off"

[messaging]
max_outbound_per_run = 10
max_blocking_questions = 2

[sandbox]
# Shell commands agents may run without asking (prefix match; passed to Claude Code as
# --allowedTools "Bash(<prefix>:*)"). File edits inside the worktree are always allowed.
# ["*"] = anything (--permission-mode bypassPermissions). `hexagon init` adds what your project needs.
# Interpreters and shells (sh, node, python, make, npx, find) are deliberately absent: they run anything, which makes an
# approval meaningless. The commands your verify steps need are asked about once, before a task starts.
allow_commands = ["npm", "pnpm", "yarn", "tsc", "vitest", "jest", "pytest", "go", "cargo", "mvn", "gradle", "./gradlew", "./mvnw", "ls", "cat", "grep", "rg", "mkdir", "test", "git status", "git diff", "git log"]
command_timeout_s = 600

[ui]
open_with = "auto"      # "auto" | "tmux" | "iterm" | "terminal" | "print"
animation = "auto"      # "auto" (= full, 15 fps; reduced over SSH) | "full" (forced)  | "reduced" | "off"; also HEXAGON_ANIMATION, NO_MOTION
startup_animation = true
inspector = true        # show the inspector panel when the terminal is wide enough
mouse = true            # wheel scrolls the chat, click selects an agent; hold Shift to select text
style = "minimal"        # "minimal" (shared solid rules, no boxes, quiet input) | "classic" (framed panels); also HEXAGON_UI_STYLE
ambient = false         # off by default (costs frames); faint hexagons drifting behind the network; fades when you are away, off with motion=off

# Cost. Hexagon ships no prices. It shows the cost a CLI reports; for a CLI that reports none, fill in your own
# prices (per million tokens, by agent id) and `hexagon stats --cost` marks those figures as estimates.
# [prices.codex]
# input_per_mtok = 0.0
# cache_read_per_mtok = 0.0
# output_per_mtok = 0.0
