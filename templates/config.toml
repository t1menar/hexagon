# Hexagon project configuration. Values shown are the defaults.

[run]
max_parallel = 4        # agents running at once
max_attempts = 2        # attempts per task (a retry escalates effort one level)
fix_loops = 2           # verify/review fix rounds within an attempt
budget_tokens = 0       # pause the run after this many tokens (input + cached + output; 0 = no limit)
# base_branch = "main"  # default: the branch checked out when the run starts

# Which agent, model and effort each role uses. Agents are defined below. `model` overrides the
# agent's default model for that role (any value `claude --model` accepts: opus, sonnet, haiku, a full id).
# Change it from the dashboard with /model <role> <model>, e.g. /model planner opus.
[roles.init]
agent = "claude"
model = "sonnet"
effort = "medium"
[roles.planner]
agent = "claude"
model = "opus"
effort = "high"
[roles.implementer]
agent = "claude"
model = "sonnet"
effort = "medium"
[roles.tester]
agent = "claude"
model = "sonnet"
effort = "medium"
[roles.reviewer]
agent = "claude"
model = "opus"
effort = "high"
[roles.lead]
agent = "claude"
model = "opus"
effort = "low"

# Agents are coding CLIs that Hexagon wraps; each runs in its own git worktree.
# claude-code: the Claude Code CLI (streams events, takes live messages, takeover = `claude --resume`).
[agents.claude]
adapter = "claude-code"
command = ["claude"]
model = "sonnet"        # any value `claude --model` accepts
# args = ["--add-dir", "../shared"]

# Any other non-interactive coding CLI ({prompt} is replaced by the task prompt):
# [agents.codex]
# adapter = "exec"
# command = ["codex", "exec", "--full-auto", "{prompt}"]

# Scripted offline agent, useful to try the workflow without spending anything:
#   set agent = "mock" for every role, or `hexagon run plan.json --agent mock`
[agents.mock]
adapter = "mock"
step_ms = 600

[review]
mode = "agent"          # "agent" | "off"

[messaging]
max_outbound_per_run = 10
max_blocking_questions = 2

[sandbox]
# Shell commands agents may run without asking (prefix match; passed to Claude Code as
# --allowedTools "Bash(<prefix>:*)"). File edits inside the worktree are always allowed.
# ["*"] = anything (--permission-mode bypassPermissions). `hexagon init` adds what your project needs.
allow_commands = ["npm", "npx", "pnpm", "yarn", "node", "tsc", "vitest", "jest", "pytest", "python", "python3", "go", "cargo", "make", "mvn", "gradle", "./gradlew", "./mvnw", "java", "sh", "ls", "cat", "grep", "rg", "find", "mkdir", "test", "git status", "git diff", "git log"]
command_timeout_s = 600

[ui]
open_with = "auto"      # "auto" | "tmux" | "iterm" | "terminal" | "print"
